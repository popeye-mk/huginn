name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # The knowledge base is the part most likely to rot, and YAML has
      # no compiler. Lint it on every push (spec §12.3).
      - run: python cli.py kb lint
